name: Refresh prices
on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - scripts/fetch-prices.mjs
      - .github/workflows/refresh-prices.yml
permissions:
  contents: write
concurrency:
  group: refresh-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch prices from CoinGecko
        id: fetch
        continue-on-error: true
        run: node scripts/fetch-prices.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || (git commit -m "Refresh prices" && git pull --rebase -q && git push)
      - name: Fail the run if prices could not be fetched
        if: steps.fetch.outcome == 'failure'
        run: exit 1
