name: Refresh posts
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    paths:
      - scripts/fetch-posts.mjs
      - .github/workflows/refresh-posts.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch posts and articles
        id: fetch
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/fetch-posts.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts.json articles.json
          git diff --cached --quiet || (git commit -m "Refresh posts" && git push)
      - name: Fail the run if no posts could be fetched
        if: steps.fetch.outcome == 'failure'
        run: exit 1
