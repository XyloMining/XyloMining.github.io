name: Refresh Instagram and TikTok
# Pulls Instagram and TikTok posts and their stats from Buffer's API into postsig.json / poststt.json,
# then rebuilds stats.json. Needs the repository secret BUFFER_API_KEY. Followers come from data/followers.json (Buffer has none).
# Runs once a day at 10:00 Melbourne time (AEDT, UTC+11), 12 hours after the 22:00 posts. GitHub cron is in UTC, so this is 23:00 UTC the day before;
# when daylight saving ends (4 Apr 2027) it will run at 09:00 local time: change the hour to "0" then to keep 10:00.
# GitHub can start scheduled runs a few minutes late. Run it by hand from the Actions tab at any time.
on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
  push:
    paths:
      - scripts/buffer_sync.py
      - scripts/buffer_to_json.py
      - .github/workflows/refresh-buffer.yml
permissions:
  contents: write
concurrency:
  group: refresh-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch posts and stats from Buffer
        id: sync
        continue-on-error: true
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python3 scripts/buffer_sync.py
      - name: Build stats.json
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/fetch-stats.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add postsig.json poststt.json stats.json data/buffer_sync.json
          git diff --cached --quiet || (git commit -m "Refresh Instagram and TikTok from Buffer" && git pull --rebase -q && git push)
      - name: Fail the run if the Buffer fetch failed
        if: steps.sync.outcome == 'failure'
        run: |
          echo "::error::Buffer sync failed. See data/buffer_sync.json in the repo for the reason."
          exit 1
