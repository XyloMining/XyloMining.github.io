name: Refresh stats
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - scripts/fetch-stats.mjs
      - scripts/tiktok_stats.py
      - .github/workflows/refresh-stats.yml
permissions:
  contents: write
concurrency:
  group: refresh-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch TikTok stats (TikTok-Api)
        id: tiktok
        continue-on-error: true
        env:
          ms_token: ${{ secrets.TIKTOK_MS_TOKEN }}
        run: |
          pip install TikTokApi
          python -m playwright install --with-deps chromium
          python scripts/tiktok_stats.py xylo_mining --count 30
      - name: Build stats.json
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/fetch-stats.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git diff --cached --quiet || (git commit -m "Refresh stats" && git pull --rebase -q && git push)
      - name: Flag a failed TikTok fetch
        if: steps.tiktok.outcome == 'failure'
        run: echo "::warning::TikTok fetch failed (TikTok often blocks datacenter IPs); kept the previous TikTok numbers."
